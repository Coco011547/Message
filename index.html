<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IMS Spreadsheet Formatter</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
body {
  font-family: Segoe UI, Roboto, Arial, sans-serif;
  margin: 24px;
}
h1 { font-size: 1.4rem; }
h2 { font-size: 1.1rem; margin-top: 28px; }
label { font-weight: 600; display:block; margin-top:12px; }
input, select {
  width:100%;
  max-width:720px;
  padding:8px;
}
button {
  padding:8px 12px;
  margin-top:10px;
  margin-right:6px;
}
.output {
  white-space: pre-wrap;
  font-family: Consolas, monospace;
  border:1px solid #ccc;
  background:#fafafa;
  padding:16px;
  border-radius:6px;
}
.muted { font-size:12px; color:#666; }
</style>

<!-- SheetJS (local XLSX reader) -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>

<body>

<h1>IMS Activities Formatter (Spreadsheet‑Driven)</h1>
<p class="muted">
Excel / CSV is the source of truth. Output remains until a new file is loaded.
</p>

<h2>1) Load Spreadsheet</h2>

<label>Date</label>
<input type="date" id="dateInput">

<label>Spreadsheet (.xlsx or .csv)</label>
<input type="file" id="fileInput" accept=".xlsx,.csv">

<label>Status</label>
<select id="statusSelect">
  <option value="">---</option>
  <option value="Planned Tonight">Planned Tonight</option>
  <option value="Completed">Completed</option>
</select>

<br>
<button id="loadBtn">Load Spreadsheet</button>
<button id="ocrModeBtn">OCR Mode</button>

<h2>2) Formatted Output</h2>
<button id="copyBtn">Copy</button>

<div id="formattedOutput" class="output"></div>

<script>
/* ---------- helpers ---------- */
const todayISO = () => new Date().toISOString().slice(0,10);
const yesterdayISO = () => {
  const d = new Date(); d.setDate(d.getDate() - 1);
  return d.toISOString().slice(0,10);
};

const prettyDate = iso =>
  new Date(iso).toLocaleDateString(undefined,{
    day:'2-digit', month:'long', year:'numeric'
  });

/* ---------- spreadsheet reader ---------- */
function readSpreadsheet(file){
  return new Promise(resolve=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, { type:'array' });
      const ws = wb.Sheets[wb.SheetNames[0]];
      resolve(XLSX.utils.sheet_to_json(ws, { header:1 }));
    };
    reader.readAsArrayBuffer(file);
  });
}

/* ---------- formatting logic ---------- */
function formatOutput(rows, statusSel){
  if(!rows || !rows.length) return '';

  const headers = rows[0].map(h=>String(h).trim());
  const idx = {};
  headers.forEach((h,i)=>idx[h]=i);

  if(idx['Node Type'] === undefined || idx['PE Purpose'] === undefined)
    return 'Missing required headers: Node Type, PE Purpose';

  const statusCols = ['Status','Status J','Status K']
    .filter(h=>h in idx).map(h=>idx[h]);

  const iNode = idx['Node Type'];
  const iPE   = idx['PE Purpose'];
  const iCat  = idx['PE Category'];

  const data = rows.slice(1);
  const isCancelled = r =>
    statusCols.some(i=>String(r[i]||'').toLowerCase().includes('cancelled'));

  const nonCancelled = data.filter(r=>!isCancelled(r));
  const cancelledCount = data.length - nonCancelled.length;

  let effective = nonCancelled;
  if(statusSel === 'Completed' && statusCols.length){
    effective = nonCancelled.filter(r =>
      statusCols.some(i=>String(r[i]||'').toLowerCase().includes('completed'))
    );
  }

  const totalCount = effective.length;
  const completedCount = effective.length;

  let peCatCount = totalCount;
  if(iCat !== undefined){
    peCatCount = new Set(
      nonCancelled.map(r=>String(r[iCat]||'').trim()).filter(Boolean)
    ).size;
  }

  let d = dateInput.value;
  if(!d) d = statusSel === 'Completed' ? yesterdayISO() : todayISO();

  const ntCount = {};
  effective.forEach(r=>{
    const nt = String(r[iNode]||'(Unknown)').trim();
    ntCount[nt] = (ntCount[nt]||0) + 1;
  });

  const ntBlock = Object.entries(ntCount)
    .sort((a,b)=>a[0].localeCompare(b[0]))
    .map(([k,v])=>`${k}\t-${v}`)
    .join('\n');

  let header='';
  if(statusSel === 'Completed'){
    header =
`*VVM Status* ${prettyDate(d)} completed ${completedCount}/${totalCount} (${peCatCount} PE Category) ${completedCount} PE's Completed, ${cancelledCount} Cancelled\n\n`;
  } else if(statusSel === 'Planned Tonight'){
    header = `*Planned Tonight* IMS activities ${prettyDate(d)}\n\n`;
  } else {
    header = `IMS activities ${prettyDate(d)}\n\n`;
  }

  const details = effective.map((r,i)=>
    `${i+1}-\t${r[iPE]||''}\t---\t${statusSel==='Planned Tonight'
      ? '*Planned Tonight*' : '*Completed*'}`
  ).join('\n\n');

  return header + ntBlock + '\n\n*Key PE Details*\n\n' + details;
}

/* ---------- wiring ---------- */
const out = document.getElementById('formattedOutput');

loadBtn.onclick = async()=>{
  if(!fileInput.files[0]) return;
  const rows = await readSpreadsheet(fileInput.files[0]);
  const text = formatOutput(rows, statusSelect.value);
  out.textContent = text;
};

copyBtn.onclick = () =>
  navigator.clipboard.writeText(out.textContent || '');

ocrModeBtn.onclick = () => {
  const w = window.open('', '_blank');
  w.document.write(`
    <html>
    <head>
      <meta charset="utf-8">
      <title>IMS OCR Mode</title>
      <style>
        body {
          font-family: Consolas, monospace;
          padding: 24px;
          font-size: 18px;
          line-height: 1.8;
          white-space: pre-wrap;
        }
      </style>
    </head>
    <body>${out.textContent.replace(/</g,'&lt;')}</body>
    </html>
  `);
};

dateInput.value = todayISO();
</script>

</body>
</html>
